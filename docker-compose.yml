services:
  echo:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional: the backend starts normally and reports Cloud as unavailable when unset.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-6-luna}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:0.6b}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [local]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:0.6b}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull $$OLLAMA_EMBEDDING_MODEL &&
      ollama pull $$OLLAMA_CHAT_MODEL"
    profiles: [local]

volumes:
  ollama_data:
